name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # ubuntu-latest ships shellcheck. Checks every installer and the scripts
        # they install (rootfs/usr/local/bin, including .in templates).
        run: |
          find . -name 'install-*.sh' -o -path '*/rootfs/usr/local/bin/*' -type f \
            | sort | xargs -r shellcheck -s bash
